<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LocalNotes</title>
    <style>
        :root {
            color-scheme: light dark;
            font-family: system-ui, sans-serif;
            background: #f5f2e9;
            color: #191919;
        }

        body {
            max-width: 52rem;
            margin: 0 auto;
            padding: 3rem 1.25rem;
        }

        header { margin-bottom: 2rem; }
        h1 { margin-bottom: .25rem; }
        #summary { margin-top: 0; color: #626262; }
        #notes { display: grid; gap: 1rem; }

        article {
            padding: 1.25rem;
            border: 2px solid currentColor;
            border-radius: .75rem;
            background: #fff;
            box-shadow: 4px 4px 0 #191919;
        }

        article h2 { margin: 0 0 .5rem; }
        article p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
        article time { display: block; margin-top: 1rem; color: #626262; font-size: .875rem; }

        @media (prefers-color-scheme: dark) {
            :root { background: #171717; color: #f5f2e9; }
            article { background: #242424; box-shadow: 4px 4px 0 #f5f2e9; }
            #summary, article time { color: #b9b9b9; }
        }
    </style>
</head>
<body>
    <header>
        <h1>LocalNotes</h1>
        <p id="summary">Loading notes…</p>
    </header>
    <main id="notes" aria-live="polite"></main>

    <script>
        const notesElement = document.querySelector('#notes');
        const summaryElement = document.querySelector('#summary');

        function renderNote(note) {
            const article = document.createElement('article');
            const title = document.createElement('h2');
            const content = document.createElement('p');
            const modified = document.createElement('time');

            title.textContent = note.title || 'Untitled';
            content.textContent = note.content;
            modified.dateTime = new Date(note.dateModified).toISOString();
            modified.textContent = `Updated ${new Date(note.dateModified).toLocaleString()}`;
            article.append(title, content, modified);
            return article;
        }

        fetch('/api/notes')
            .then(response => {
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                return response.json();
            })
            .then(notes => {
                summaryElement.textContent = notes.length === 1 ? '1 note' : `${notes.length} notes`;
                if (notes.length === 0) {
                    notesElement.textContent = 'No notes yet.';
                    return;
                }
                notesElement.replaceChildren(...notes.map(renderNote));
            })
            .catch(() => {
                summaryElement.textContent = 'Unable to load notes';
                notesElement.textContent = 'Make sure LocalNotes is running, then refresh this page.';
            });
    </script>
</body>
</html>
